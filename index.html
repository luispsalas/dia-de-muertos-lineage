<style>
/* Layout: a horizontal timeline, one lane per symbol, papel-picado banners hung at the right end (today); details open in a side card. */
:root {
  --bg: #fbf6f9;        /* papel de china, pale */
  --panel: #ffffff;
  --ink: #23142b;
  --muted: #6c5a72;
  --line: #ddcfdc;
  --rosa: #c8006a;      /* rosa mexicano */
  --naranja: #d9650a;   /* cempasúchil */
  --morado: #6a3d9e;
  --verde: #0f7a63;
  --azul: #1f5fae;
  --ambar: #a86a00;   /* Hollywood */
  --cielo: #0f7c99;   /* city institutions */
  --trigo: #8f5b1e;   /* pan de muerto */
  --lima: #4f7a0c;    /* crafts and fairs */
  --tinta: #46536a;   /* calaveritas literarias */
  --gris: #9a8ca0;
  --font-display: "Alfa Slab One", "Rockwell", Georgia, serif;
  --font-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-quote: "IBM Plex Serif", Georgia, serif;
  --font-data: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #150e1d; --panel: #211730; --ink: #f2e9f3; --muted: #b6a6bb; --line: #3b2e47;
    --rosa: #ff5aab; --naranja: #ff9d42; --morado: #b391ff; --verde: #3fcca8; --azul: #6aa8ff; --ambar: #ffc04d; --cielo: #4fd0f0; --trigo: #e3ad6b; --lima: #b5d65a; --tinta: #a9b8cf; --gris: #7d6f86;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #150e1d; --panel: #211730; --ink: #f2e9f3; --muted: #b6a6bb; --line: #3b2e47;
  --rosa: #ff5aab; --naranja: #ff9d42; --morado: #b391ff; --verde: #3fcca8; --azul: #6aa8ff; --ambar: #ffc04d; --cielo: #4fd0f0; --trigo: #e3ad6b; --lima: #b5d65a; --tinta: #a9b8cf; --gris: #7d6f86;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--font-body); font-size: 15px; line-height: 1.55;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 28px 48px;
}
.wrap { max-width: 1240px; margin: 0 auto; display: grid; gap: 28px; }
header { display: grid; gap: 12px; }
.topline { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; }
.eyebrow { font-family: var(--font-data); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
h1 { font-family: var(--font-display); font-weight: 400; font-size: clamp(32px, 6vw, 56px); line-height: 1.02; margin: 0; letter-spacing: .01em; text-wrap: balance; }
h1 .acc { color: var(--rosa); }
.intro { max-width: 64ch; margin: 0; color: var(--ink); }
.lang { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; padding: 3px; background: var(--panel); }
.lang button { font: 500 13px var(--font-data); border: 0; background: transparent; color: var(--muted); padding: 5px 12px; border-radius: 999px; cursor: pointer; }
.lang button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.lang button:focus-visible, .node:focus-visible, .edgehit:focus-visible, a:focus-visible { outline: 2px solid var(--rosa); outline-offset: 2px; }

.legend { display: flex; flex-wrap: wrap; gap: 10px 28px; align-items: center; font-size: 13px; color: var(--muted); }
.legend .group { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; }
.legend .gl { font-family: var(--font-data); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; }
.legend .item { display: inline-flex; gap: 6px; align-items: center; }
.legend svg { flex: none; }
.swatch { width: 10px; height: 10px; border-radius: 2px; display: inline-block; }

.main { display: grid; gap: 20px; grid-template-columns: minmax(0, 1fr); }
@media (min-width: 1600px) { .wrap { max-width: 1600px; } .main { grid-template-columns: minmax(0, 1fr) 340px; align-items: start; } }
.diagram { position: relative; overflow-x: auto; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); -webkit-overflow-scrolling: touch; }
.diagram svg { display: block; }
.hint { font-size: 12px; color: var(--muted); margin: 6px 0 0; }
@media (min-width: 940px) { .hint { display: none; } }

/* SVG */
.lane-label { font-family: var(--font-display); font-size: 17px; fill: var(--ink); }
.axis text { font-family: var(--font-data); font-size: 11px; fill: var(--muted); }
.axis line { stroke: var(--line); }
.lane-rule { stroke: var(--line); stroke-width: 1; }
.yr { font-family: var(--font-data); font-size: 10.5px; fill: var(--muted); }
.nlabel { font-family: var(--font-body); font-size: 12px; fill: var(--ink); }
.nlabel, .yr { paint-order: stroke; stroke: var(--bg); stroke-width: 4px; stroke-linejoin: round; }
.nlabel.myth { fill: var(--muted); font-style: italic; }
.edge { fill: none; stroke-width: 2.2; stroke-linecap: round; }
.edge.doc { stroke-dasharray: none; }
.edge.stu { stroke-dasharray: 7 5; }
.edge.pop { stroke-dasharray: 1.5 5; }
.edge.disp { stroke-dasharray: 1.5 5; opacity: .45; }
.edge.pend { stroke: var(--gris); stroke-dasharray: 2 6; stroke-width: 1.5; opacity: .8; }
.edgehit { fill: none; stroke: transparent; stroke-width: 16; cursor: pointer; }
.node { cursor: pointer; }
.node .halo { fill: var(--bg); }
.node.sel .ring { stroke: var(--ink); stroke-width: 2; fill: none; }
.node:hover .core, .node:focus .core { filter: brightness(1.1); }
.xmark { stroke-width: 2; stroke-linecap: round; }
.banner-cap { font-family: var(--font-data); font-size: 10px; fill: var(--muted); letter-spacing: .06em; }
.today { cursor: pointer; }
.today .bframe { fill: none; stroke: transparent; stroke-width: 2; }
.today:hover .bframe, .today:focus .bframe { stroke: var(--line); }
.today.sel .bframe { stroke: var(--ink); }
.today:focus-visible { outline: none; }
.today:focus-visible .bframe { stroke: var(--rosa); }
.steps { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
.steps button { all: unset; box-sizing: border-box; width: 100%; display: grid; grid-template-columns: 18px 76px minmax(0, 1fr); gap: 6px; align-items: baseline; padding: 5px 6px; border-radius: 5px; cursor: pointer; font-size: 13.5px; }
.steps button:hover, .steps button:focus-visible { background: color-mix(in srgb, var(--line) 45%, transparent); }
.steps button:focus-visible { outline: 2px solid var(--rosa); outline-offset: 1px; }
.steps .y { font-family: var(--font-data); font-size: 11.5px; color: var(--muted); }
.card h3 { font-family: var(--font-data); font-weight: 500; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 0; }
.legendnote { font-size: 12.5px; color: var(--muted); }

/* tooltip */
.tip { position: absolute; z-index: 5; max-width: 260px; background: var(--panel); color: var(--ink); border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px; font-size: 13px; line-height: 1.45; box-shadow: 0 6px 24px rgba(20, 8, 30, .18); pointer-events: none; }
.tip b { display: block; font-weight: 600; margin-bottom: 2px; }
.tip .r { font-family: var(--font-data); font-size: 11px; color: var(--muted); }

/* side card */
aside.card { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 18px 18px 20px; display: grid; gap: 14px; min-width: 0; }
@media (min-width: 1600px) { aside.card { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 16px); max-height: calc(100vh - 32px); overflow: auto; } }
.card .kicker { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; font-family: var(--font-data); font-size: 12px; color: var(--muted); }
.chip { display: inline-flex; align-items: center; gap: 5px; font-family: var(--font-body); font-size: 12px; padding: 2px 8px; border-radius: 999px; border: 1px solid currentColor; }
.card h2 { font-family: var(--font-display); font-weight: 400; font-size: 22px; line-height: 1.15; margin: 0; text-wrap: balance; }
.card p { margin: 0; }
.claims { list-style: none; margin: 0; padding: 0; display: grid; gap: 14px; }
.claims li { display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 4px 8px; border-top: 1px solid var(--line); padding-top: 12px; }
.claims .mark { font-size: 15px; line-height: 1.4; }
.claims .body { display: grid; gap: 6px; min-width: 0; }
blockquote { margin: 0; font-family: var(--font-quote); font-style: italic; font-size: 15px; line-height: 1.45; border-left: 3px solid var(--line); padding-left: 10px; }
.tr { font-size: 13px; color: var(--muted); }
.tr .lab { font-family: var(--font-data); font-size: 10.5px; letter-spacing: .06em; text-transform: uppercase; margin-right: 4px; }
.note { font-size: 13px; color: var(--muted); }
.src { font-size: 12.5px; color: var(--muted); }
.src a { color: var(--azul); text-underline-offset: 2px; }
.whyd { font-size: 13px; background: color-mix(in srgb, var(--rosa) 9%, transparent); border-radius: 6px; padding: 8px 10px; }

footer { display: grid; gap: 14px; border-top: 1px solid var(--line); padding-top: 18px; }
footer h3 { font-family: var(--font-display); font-weight: 400; font-size: 18px; margin: 0; }
.bib { display: grid; gap: 14px 28px; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); font-size: 13px; }
.bib h4 { margin: 0 0 4px; font-size: 13px; font-weight: 600; }
.bib ul { margin: 0; padding-left: 18px; color: var(--muted); }
.bib li { margin-bottom: 3px; }
.bib a { color: var(--azul); }
.fine { font-size: 12.5px; color: var(--muted); max-width: 80ch; margin: 0; }
@media (prefers-reduced-motion: no-preference) {
  .banner { transform-box: fill-box; transform-origin: 50% 0; animation: sway 6s ease-in-out infinite; }
  .banner:nth-of-type(2n) { animation-delay: -2s; }
  @keyframes sway { 0%, 100% { transform: rotate(-1.2deg); } 50% { transform: rotate(1.2deg); } }
}
</style>

    label: { es: "Xoloitzcuintli sin pelo", en: "Hairless Xoloitzcuintli" },
    card: { es: "En otro libro, Sahagún describe los perros sin pelo, que se abrigaban de noche con mantas. No dice nada de los muertos.", en: "In another book, Sahagún describes the hairless dogs, wrapped in blankets at night. He says nothing about the dead." },
    claims: [{ rank: "doc", t: { es: "Algunos los volvían lampiños untándolos con resina; otros decían que nacían así.", en: "Some made them hairless by rubbing them with resin; others said they were born that way." },
      q: "que ningún pelo tenian, y de noche abrigábanlos con mantas", qen: "which had no hair at all, and at night they wrapped them in blankets", s: "sah3", where: { es: "libro XI", en: "book XI" } }] },
  { id: "xm", lane: "xolo", year: 1800, dy: 0, rank: "disp", infl: "mexica", yr: "¿cuándo?", yrEn: "when?", myth: true,
    label: { es: "«El xolo guía a las almas»", en: "“The Xolo guides souls”" },
    card: { es: "En Sahagún son dos perros distintos. La fusión es posterior y aún no la fechamos.", en: "In Sahagún these are two different dogs. The merger came later, and we have not dated it yet." },
    why: { es: "El perro guía se describe por su pelo rojizo. El xoloitzcuintli aparece en otro libro, sin relación con la muerte. Falta revisar la columna en náhuatl del Códice Florentino, que podría describir al guía como amarillo.", en: "The guide dog is described by its reddish coat. The Xoloitzcuintli appears in another book, with no link to death. The Nahuatl column of the Florentine Codex still needs checking; it may describe the guide as yellow." },
    claims: [] },

  // CATRINA
  { id: "k1", lane: "catrina", year: 1913, dy: 26, rank: "doc", infl: "prensa", yr: "1913",
    label: { es: "Calavera garbancera", en: "Calavera garbancera" },
    card: { es: "Grabado de Posada: una calavera de busto con sombrero de plumas. Satiriza a quienes negaban su origen indígena.", en: "A Posada etching: a skull, shoulders up, in a feathered hat. It mocks people who denied their Indigenous roots." },
    claims: [
      { rank: "doc", t: { es: "El grabado está en colecciones de museo, fechado c. 1910–1913.", en: "The etching is in museum collections, dated c. 1910–1913." }, s: "colgate" },
      { rank: "stu", t: { es: "Según el historiador Agustín Sánchez González, la placa se hizo hacia 1912 y la hoja salió en noviembre de 1913, después de la muerte de Posada.", en: "According to historian Agustín Sánchez González, the plate was made around 1912 and the broadsheet came out in November 1913, after Posada's death." }, s: "sanchez" }] },
  { id: "k2", lane: "catrina", year: 1930, dy: -26, rank: "doc", infl: "prensa", yr: "1930",
    label: { es: "Ya se llama «Calavera Catrina»", en: "Already “Calavera Catrina”" },
    card: { es: "En la primera monografía de Posada, con introducción de Diego Rivera, el grabado ya se titula «Calavera Catrina».", en: "In the first Posada monograph, introduced by Diego Rivera, the print is already titled “Calavera Catrina”." },
    claims: [
      { rank: "doc", t: { es: "Entrada 305 de la lista de ilustraciones.", en: "Entry 305 in the list of illustrations." }, q: "305 Calavera Catrina … 160", qen: "305 Calavera Catrina … 160",
        n: { es: "No sabemos quién eligió el título: los editores fueron Frances Toor, Pablo O'Higgins y Blas Vanegas Arroyo.", en: "We don't know who chose the title. The editors were Frances Toor, Pablo O'Higgins and Blas Vanegas Arroyo." }, s: "mono" },
      { rank: "doc", t: { es: "El libro y su fecha, en el registro del Met.", en: "The book and its date, in the Met's record." }, s: "met" }] },
  { id: "k3", lane: "catrina", year: 1947, dy: 26, rank: "doc", infl: "prensa", yr: "1947",
    label: { es: "Rivera le da cuerpo", en: "Rivera gives her a body" },
    card: { es: "En el mural «Sueño de una tarde dominical en la Alameda Central» la Catrina aparece de cuerpo entero, vestida, junto a Posada.", en: "In the mural “Sueño de una tarde dominical en la Alameda Central”, the Catrina appears full-length and dressed, beside Posada." },
    claims: [{ rank: "doc", t: { es: "Pintado en 1947 para el Hotel del Prado; hoy está en el Museo Mural Diego Rivera.", en: "Painted in 1947 for the Hotel del Prado; now in the Museo Mural Diego Rivera." }, s: "inbal" }] },
  { id: "km", lane: "catrina", year: 1947, dy: -58, rank: "disp", infl: "prensa", yr: "1947", myth: true,
    label: { es: "«Rivera la bautizó»", en: "“Rivera named her”" },
    card: { es: "Se repite mucho, pero el nombre ya estaba impreso en 1930, diecisiete años antes del mural.", en: "Widely repeated, but the name was already in print in 1930, seventeen years before the mural." },
    why: { es: "La lista de ilustraciones de 1930 ya dice «Calavera Catrina». El vínculo de Rivera con el nombre existe, pero es anterior y menos directo: escribió la introducción de ese libro.", en: "The 1930 list of illustrations already says “Calavera Catrina”. Rivera's link to the name is real, but earlier and less direct: he wrote that book's introduction." },
    claims: [{ rank: "pop", t: { es: "Un ejemplo de la versión popular.", en: "An example of the popular version." }, s: "univ2020" }] },
  { id: "k4", lane: "catrina", year: 1948, dy: 60, rank: "stu", infl: "prensa", yr: "1948",
    label: { es: "Primer uso en prensa hallado", en: "Earliest press use found" },
    card: { es: "La frase «calavera catrina» aparece en la revista Mañana el 19 de junio de 1948, y varias veces en 1952.", en: "The phrase “calavera catrina” appears in Mañana magazine on 19 June 1948, and several times in 1952." },
    claims: [{ rank: "stu", t: { es: "Es el primero hallado, no necesariamente el primero impreso: muchas páginas de esos años solo se consultan en la sala de la Hemeroteca.", en: "The earliest found, not necessarily the earliest printed: many pages from those years can only be read on site." }, s: "hndm" }] },

  // ALEBRIJES
  { id: "a1", lane: "alebrije", year: 1936, dy: 0, rank: "stu", infl: "prensa", yr: "1936 ¿o 1947?", yrEn: "1936 or 1947?", short: { es: "Pedro Linares", en: "Pedro Linares" },
    label: { es: "Pedro Linares los inventa", en: "Pedro Linares invents them" },
    card: { es: "Un cartonero de la Ciudad de México, que hacía Judas y piezas para Diego Rivera y Frida Kahlo, crea unas criaturas fantásticas de papel maché.", en: "A Mexico City papier-mâché maker, who made Judas figures and pieces for Diego Rivera and Frida Kahlo, creates fantastic papier-mâché creatures." },
    why: { es: "La fecha está en duda. Casi todas las fuentes dicen 1936, pero en 2019 la Secretaría de Cultura de la CDMX y el nieto de Linares dijeron 1947.", en: "The date is disputed. Most sources say 1936, but in 2019 Mexico City's culture secretary and Linares's grandson said 1947." },
    claims: [
      { rank: "stu", t: { es: "Linares es el creador; lo reconocen las fuentes y, en 2019, la propia ciudad.", en: "Linares is the creator; sources agree, and so did the city in 2019." }, s: "wlin" },
      { rank: "stu", t: { es: "La fecha de 1947, según la ciudad y la familia en 2019.", en: "The 1947 date, per the city and the family in 2019." },
        q: "recordaron que en 1947 nació esta pieza artesanal denominada “alebrije” por su creador", qen: "they recalled that this craft piece, named “alebrije” by its creator, was born in 1947", s: "exc19" },
      { rank: "pop", t: { es: "El famoso sueño con fiebre, con criaturas que gritaban «¡Alebrijes!», se repite mucho pero no tiene otra fuente que el relato.", en: "The famous fever dream, with creatures shouting “¡Alebrijes!”, is widely retold but has no source beyond the story itself." }, s: "wale" }] },
  { id: "a2", lane: "alebrije", year: 1975, dy: -26, rank: "doc", infl: "prensa", yr: "1975", short: { es: "Documental", en: "Documentary" },
    label: { es: "Un documental los lleva fuera", en: "A documentary takes them abroad" },
    card: { es: "La cineasta Judith Bronowski filma a Linares en 1975; su obra empieza a conocerse fuera de México.", en: "Filmmaker Judith Bronowski films Linares in 1975, and his work becomes known outside Mexico." },
    claims: [{ rank: "doc", t: { es: "Pedro Linares: Artesano de Cartón (1975).", en: "Pedro Linares: Artesano de Cartón (1975)." },
      q: "Co-produced, co-directed, and wrote this story of the maker of 'alebrijes', fantastic colorful monsters", qen: "Co-produced, co-directed, and wrote this story of the maker of 'alebrijes', fantastic colorful monsters", s: "afana" }] },
  { id: "a3", lane: "alebrije", year: 1985, dy: 30, rank: "stu", infl: "prensa", yr: "años 70–80", yrEn: "1970s–80s", short: { es: "Rama de Oaxaca", en: "Oaxacan branch" },
    label: { es: "Rama oaxaqueña, de madera", en: "An Oaxacan branch, in wood" },
    card: { es: "Tras conocer a Linares, el tallador Manuel Jiménez hace alebrijes de madera en Oaxaca. Hoy muchos piensan que el alebrije es oaxaqueño.", en: "After meeting Linares, carver Manuel Jiménez makes wooden alebrijes in Oaxaca. Today many people think the alebrije is Oaxacan." },
    claims: [
      { rank: "stu", t: { es: "Según Wikipedia, Jiménez tomó la idea de Linares.", en: "According to Wikipedia, Jiménez took the idea from Linares." },
        q: "who took the concept of alebrijes from Linares and began producing wooden \"Oaxacan alebrijes\"", qen: "who took the concept of alebrijes from Linares and began producing wooden \"Oaxacan alebrijes\"", s: "wlin" },
      { rank: "doc", t: { es: "La familia Linares rechaza que se confundan.", en: "The Linares family objects to the two being confused." },
        q: "la confusión que prevalece entre el alebrije, las tonas y las tallas de madera oaxaqueñas", qen: "the confusion that prevails between the alebrije, the tonas and the Oaxacan wood carvings", s: "exc25" }] },
  { id: "a4", lane: "alebrije", year: 2007, dy: -30, rank: "stu", infl: "ciudad", yr: "2007", short: { es: "Desfile del museo", en: "Museum parade" },
    label: { es: "Desfile de Alebrijes Monumentales", en: "Monumental alebrije parade" },
    card: { es: "El Museo de Arte Popular organiza cada octubre un desfile de alebrijes gigantes. Así entran al calendario de muertos, diez años antes de Coco.", en: "Each October the Museo de Arte Popular stages a parade of giant alebrijes. That is how they joined the Day of the Dead calendar, ten years before Coco." },
    claims: [{ rank: "stu", t: { es: "Organizado por el Museo de Arte Popular desde 2007.", en: "Organized by the Museo de Arte Popular since 2007." }, s: "wale" }] },
  { id: "a5", lane: "alebrije", year: 2017, dy: 30, rank: "doc", infl: "cine", yr: "2017", short: { es: "Coco", en: "Coco" },
    label: { es: "Coco: guías de las almas", en: "Coco: spirit guides" },
    card: { es: "En Coco, los alebrijes acompañan a los muertos en su mundo, como Pepita y el xolo Dante. Es el único vínculo directo con los muertos que encontramos.", en: "In Coco, alebrijes accompany the dead in their world, like Pepita and the Xolo Dante. It is the only direct link to the dead we have found." },
    claims: [{ rank: "doc", t: { es: "La película misma (Pixar, 2017).", en: "The film itself (Pixar, 2017)." }, s: "wale" }] },
  { id: "a6", lane: "alebrije", year: 2019, dy: -62, rank: "stu", infl: "ciudad", yr: "2019", short: { es: "Patrimonio", en: "Heritage" },
    label: { es: "Patrimonio de la CDMX", en: "Mexico City heritage" },
    card: { es: "La ciudad declara los alebrijes de Pedro Linares patrimonio cultural intangible: se anuncia en el desfile de octubre y se publica el 30 de diciembre de 2019.", en: "The city declares Pedro Linares's alebrijes intangible cultural heritage, announced at the October parade and published on 30 December 2019." },
    claims: [{ rank: "stu", t: { es: "No encontramos el texto en la Gaceta Oficial; lo reporta la prensa.", en: "We did not find the text in the Gaceta Oficial; it is reported by the press." }, s: "mej" }] },
  { id: "a7", lane: "alebrije", year: 2025, dy: 62, rank: "doc", infl: "prensa", yr: "2025", short: { es: "Disputa", en: "Dispute" },
    label: { es: "La familia contra el museo", en: "The family vs the museum" },
    card: { es: "El nieto de Linares acusa al desfile del Museo de Arte Popular de apropiarse del alebrije. Es la postura de una de las partes.", en: "Linares's grandson accuses the Museo de Arte Popular's parade of appropriating the alebrije. This is one party's position." },
    claims: [{ rank: "doc", t: { es: "Leonardo Linares y el gestor Gustavo Barrán, en Excélsior.", en: "Leonardo Linares and cultural manager Gustavo Barrán, in Excélsior." },
      q: "como ocurre en el Desfile de Alebrijes Monumentales, que organiza el Museo de Arte Popular (MAP)", qen: "as happens in the Monumental Alebrije Parade, organized by the Museo de Arte Popular (MAP)", s: "exc25" }] },

  // GRAN DESFILE
  { id: "d1", lane: "desfile", year: 2015, dy: -42, rank: "doc", infl: "cine", yr: "2015",
    label: { es: "Bond inventa un desfile", en: "Bond invents a parade" },
    card: { es: "Spectre abre con James Bond persiguiendo a un villano entre un desfile de calaveras en la Ciudad de México. Ese desfile no existía.", en: "Spectre opens with James Bond chasing a villain through a skeleton parade in Mexico City. That parade did not exist." },
    claims: [
      { rank: "doc", t: { es: "El productor explica por qué eligieron el Día de Muertos.", en: "The producer explains why they chose the Day of the Dead." },
        q: "The writers thought the day of the death would be an excellent background in the opening sequence, very colorful, very mysterious",
        qen: "The writers thought the day of the death would be an excellent background in the opening sequence, very colorful, very mysterious",
        n: { es: "«Death» es un desliz de la cita original.", en: "“Death” is a slip in the original quote." }, s: "wilson" }] },
  { id: "dm", lane: "desfile", year: 2015, dy: 30, rank: "disp", infl: "cine", yr: "2015", myth: true,
    label: { es: "«México pagó la escena»", en: "“Mexico paid for the scene”" },
    card: { es: "Se dice que México pagó para que la película lo mostrara bien, con el Día de Muertos incluido.", en: "It is said Mexico paid for the film to show it favourably, Day of the Dead included." },
    why: { es: "Viene de correos de Sony filtrados en 2014, que solo conocemos por la prensa. El productor confirmó incentivos de México, pero negó haber cambiado el guion por ellos.", en: "It comes from Sony emails leaked in 2014, which we only know through the press. The producer confirmed incentives from Mexico but denied changing the script for them." },
    claims: [{ rank: "doc", t: { es: "La negativa del productor.", en: "The producer's denial." },
      q: "There is nothing in the script that we hadn't had before.", qen: "There is nothing in the script that we hadn't had before.", s: "wilson" }] },
  { id: "d2", lane: "desfile", year: 2016.8, dy: 0, rank: "doc", infl: "ciudad", yr: "29 oct 2016", yrEn: "29 Oct 2016",
    label: { es: "Primer Gran Desfile", en: "First Gran Desfile" },
    card: { es: "La ciudad monta el desfile que la película inventó, como campaña turística.", en: "The city stages the parade the film invented, as a tourism campaign." },
    claims: [
      { rank: "doc", t: { es: "AP sobre el origen de la idea.", en: "AP on where the idea came from." },
        q: "born out of the imagination of a scriptwriter for last year's James Bond movie", qen: "born out of the imagination of a scriptwriter for last year's James Bond movie", s: "ap16" },
      { rank: "doc", t: { es: "Lourdes Berho, al frente de la promoción turística de México, sobre la película.", en: "Lourdes Berho, head of Mexico's tourism board, on the film." },
        q: "that started to create expectations that we would have something", qen: "that started to create expectations that we would have something", s: "ap16" },
      { rank: "doc", t: { es: "Lo mismo, según funcionarios de turismo.", en: "The same, according to tourism officials." },
        q: "Mexican tourism officials say the inspiration came from the opening scenes in last year's James Bond movie", qen: "Mexican tourism officials say the inspiration came from the opening scenes in last year's James Bond movie", s: "rnz" }] },
  { id: "d3", lane: "desfile", year: 2016.9, dy: 64, rank: "stu", infl: "ciudad", yr: "10 nov 2016", yrEn: "10 Nov 2016",
    label: { es: "Se vuelve fecha oficial", en: "It becomes official" },
    card: { es: "A los doce días, la ciudad publica un acuerdo que fija la festividad desde el último sábado de octubre hasta el 2 de noviembre.", en: "Twelve days later, the city publishes an agreement fixing the festivities from the last Saturday of October to 2 November." },
    claims: [{ rank: "stu", t: { es: "No encontramos el texto en la Gaceta Oficial; lo reporta la prensa.", en: "We did not find the text in the Gaceta Oficial; it is reported by the press." },
      q: "A partir de 2017, será oficial que, desde el último sábado de octubre y hasta el 2 de noviembre", qen: "From 2017 it will be official that, from the last Saturday of October to 2 November", s: "quadratin" }] },
  // PAN DE MUERTO
  { id: "p1", lane: "pan", year: 1500, dy: -26, rank: "stu", infl: "mexica", yr: "c. 1500",
    label: { es: "Ofrendas de masa de amaranto", en: "Amaranth-dough offerings" },
    card: { es: "Los mexicas hacían figuras de masa de amaranto (huauhtli) para sus ofrendas. Un antropólogo propuso que el pan de trigo ocupó después ese lugar.", en: "The Mexica made figures of amaranth dough (huauhtli) for their offerings. An anthropologist proposed that wheat bread later took their place." },
    claims: [{ rank: "stu", t: { es: "Lorente lo presenta como una posibilidad, apoyado en Nutini (1988).", en: "Lorente presents it as a possibility, citing Nutini (1988)." },
      q: "es posible que el pan sustituyera al empleo ritual del amaranto o huauhtli prehispánico", qen: "it is possible that bread replaced the ritual use of pre-Hispanic amaranth, or huauhtli", s: "lorente", where: { es: "nota 1", en: "note 1" } }] },
  { id: "pm", lane: "pan", year: 1530, dy: 54, rank: "disp", infl: "mexica", yr: "¿c. 1520?", yrEn: "c. 1520?", myth: true,
    label: { es: "«Imita un corazón sacrificado»", en: "“It imitates a sacrificed heart”" },
    card: { es: "Se cuenta que el pan nació para reemplazar un corazón ofrecido en sacrificio y mezclado con amaranto.", en: "The story goes that the bread was created to replace a sacrificed heart mixed with amaranth." },
    why: { es: "No encontramos ningún estudio que lo sostenga. Hasta la versión de Wikipedia que la cuenta dice que no es cierta.", en: "We found no study that supports it. Even the Wikipedia version that tells it says it is not true." },
    claims: [{ rank: "pop", t: { es: "Así lo resume Wikipedia.", en: "As Wikipedia sums it up." }, q: "Although this origin is not true", qen: "Although this origin is not true", s: "wkpan" }] },
  { id: "p2", lane: "pan", year: 1560, dy: 22, rank: "stu", infl: "espana", yr: "siglo XVI", yrEn: "16th century",
    label: { es: "Trigo y «pan de ánimas»", en: "Wheat and “soul bread”" },
    card: { es: "El trigo llega con los españoles. En Castilla, Aragón y Portugal se llevaba «pan de ánimas» a las tumbas el día de difuntos.", en: "Wheat arrives with the Spanish. In Castile, Aragon and Portugal, “soul bread” was taken to the graves on All Souls' Day." },
    claims: [
      { rank: "stu", t: { es: "El pan es de origen colonial.", en: "Bread is colonial in origin." },
        q: "es un alimento de origen colonial introducido por los españoles en América", qen: "is a food of colonial origin introduced to the Americas by the Spanish", s: "lorente", where: { es: "nota 1", en: "note 1" } },
      { rank: "stu", t: { es: "El pan de ánimas como antecedente; Wikipedia cita a historiadores que no leímos.", en: "Soul bread as the antecedent; Wikipedia cites historians we have not read." }, s: "wkpan" }] },
  { id: "p3", lane: "pan", year: 1878.8, dy: -28, rank: "doc", infl: "prensa", yr: "4 nov 1878", yrEn: "4 Nov 1878",
    label: { es: "Pan de muerto en el Zócalo", en: "Pan de muerto in the Zócalo" },
    card: { es: "Un diario describe la feria de Todos Santos en el Zócalo: canastos de «tortas de muertos» y mesitas de juguete con la calavera, el pan de muerto y la vela.", en: "A newspaper describes the All Saints fair in the Zócalo: baskets of “tortas de muertos” and toy tables with the skull, the pan de muerto and the candle." },
    claims: [{ rank: "doc", t: { es: "Las mesitas eran ofrendas en miniatura que se vendían como juguetes. Es el registro más antiguo del nombre que hallamos en la prensa de la capital.", en: "The little tables were miniature ofrendas sold as toys. It is the earliest use of the name we found in the capital's press." },
      q: "mesitas con la calavera tradicional, el pan de muerto, la vela simbólica que nunca falta", qen: "little tables with the traditional skull, the pan de muerto, the symbolic candle that is never missing",
      n: { es: "Leído a ojo sobre el escaneo; en el original, «pan de- / muerto» parte la línea.", en: "Read by eye on the scan; in the original, “pan de- / muerto” breaks across a line." }, s: "siglo78" }] },
  { id: "p4", lane: "pan", year: 2020, dy: 30, rank: "stu", infl: "mexica", yr: "2020", short: { es: "Texcoco", en: "Texcoco" },
    label: { es: "Pan duro como los huesos", en: "Bread as hard as bones" },
    card: { es: "A 40 km de la CDMX, en la Sierra de Texcoco, las familias nahuas piensan el pan ritual como algo seco y duro, igual que los huesos de los muertos.", en: "Some 40 km from Mexico City, in the Sierra de Texcoco, Nahua families think of ritual bread as dry and hard, like the bones of the dead." },
    claims: [{ rank: "stu", t: { es: "Etnografía de David Lorente (INAH).", en: "Ethnography by David Lorente (INAH)." },
      q: "producir un alimento seco y duro como los huesos, entendidos como materialización física perdurable de los difuntos", qen: "to produce a food as dry and hard as bones, understood as the lasting physical form of the dead", s: "lorente" }] },

  // CALAVERITA DE AZÚCAR
  { id: "zm", lane: "azucar", year: 1500, dy: 30, rank: "pop", infl: "mexica", yr: "c. 1500",
    label: { es: "¿Herederas del tzompantli?", en: "Heirs of the tzompantli?" },
    card: { es: "Se repite que las calaveritas reemplazan los cráneos de los tzompantli, los muros de cráneos mexicas.", en: "It is often said that sugar skulls replaced the skulls of the tzompantli, the Mexica skull racks." },
    why: { es: "No encontramos ninguna fuente que trace ese paso. Los registros más antiguos que hallamos son de dulces vendidos en la fiesta de muertos de la capital, en el siglo XIX.", en: "We found no source that traces that step. The earliest records we found are of sweets sold at the capital's Day of the Dead fair, in the 19th century." },
    claims: [{ rank: "pop", t: { es: "Un ejemplo de la versión popular.", en: "An example of the popular version." },
      q: "Aparecen en sustitución a los cráneos que en tiempos precolombinos se usaban en los Tzompantlis", qen: "They appear as a substitute for the skulls that were used on the Tzompantlis in pre-Columbian times", s: "mdazu" }] },
  { id: "z1", lane: "azucar", year: 1560, dy: -26, rank: "stu", infl: "espana", yr: "siglo XVI", yrEn: "16th century",
    label: { es: "Alfeñique, de al-Ándalus", en: "Alfeñique, from al-Andalus" },

function xOf(y) {
  // five stretches: Mexica/colonial, 1600–1840 (compressed), 1840–1955 (press and art), 1955–2005 (compressed), 2005–2026 (parade, Coco, heritage)
  const span = X_END - LEFT, a = span * .24, b = span * .05, c = span * .38, d = span * .07;
  if (y <= 1600) return LEFT + (y - 1450) / 150 * a;
  if (y <= 1840) return LEFT + a + (y - 1600) / 240 * b;
  if (y <= 1955) return LEFT + a + b + (y - 1840) / 115 * c;
  if (y <= 2005) return LEFT + a + b + c + (y - 1955) / 50 * d;
  return LEFT + a + b + c + d + (y - 2005) / 21 * (span - a - b - c - d);

    el("circle", { cx: cx + 3.5, cy: cy - 19, r: 2.4, fill: W_ }, m);
    el("rect", { x: cx - 5, y: cy - 11, width: 10, height: 4, fill: B }, m);
    for (let i = 0; i < 6; i++) el("rect", { x: cx - 19 + (i % 2) * 5, y: cy - 2 + i * 5, width: 38 - (i % 2) * 10, height: 2, fill: B }, m);
  } else if (lane === "papel") {
    // three small papel picado flags on a string, each with its own cutouts
    el("rect", { x: cx - 44, y: cy - 30, width: 88, height: 2.5, fill: W_ }, m);
    [-29, 0, 29].forEach((fx, j) => {
      const x0 = cx + fx - 12, y0 = cy - 28;
      let d = `M${x0},${y0} H${x0 + 24} V${y0 + 40}`;
      for (let i = 3; i > 0; i--) d += ` A4,4 0 0 1 ${x0 + (i - 1) * 8},${y0 + 40}`;
      el("path", { d: d + " Z", fill: W_ }, m);
      const fy = y0 + 18;
      if (j === 1) { el("circle", { cx: cx + fx, cy: fy, r: 6, fill: B }, m); el("circle", { cx: cx + fx - 2.2, cy: fy - 1, r: 1.4, fill: W_ }, m); el("circle", { cx: cx + fx + 2.2, cy: fy - 1, r: 1.4, fill: W_ }, m); }
      else { for (let i = 0; i < 5; i++) { const a = i / 5 * Math.PI * 2; el("circle", { cx: cx + fx + Math.cos(a) * 4.5, cy: fy + Math.sin(a) * 4.5, r: 2.4, fill: B }, m); } }
      for (let i = 0; i < 3; i++) el("rect", { x: x0 + 4 + i * 7, y: y0 + 31, width: 3, height: 3, fill: B }, m);
    });
  } else if (lane === "alebrije") {
    // winged, horned creature with a curled tail and spotted body
    el("path", { d: `M${cx - 2},${cy + 2} L${cx - 8},${cy - 30} L${cx + 6},${cy - 14} L${cx + 14},${cy - 34} L${cx + 18},${cy - 2} Z`, fill: W_ }, m); // wings
    el("ellipse", { cx: cx + 4, cy: cy + 8, rx: 18, ry: 10, fill: W_ }, m);                                  // body
    el("circle", { cx: cx - 18, cy: cy - 2, r: 8, fill: W_ }, m);                                            // head
    el("path", { d: `M${cx - 22},${cy - 8} l-5,-10 l8,6 Z M${cx - 15},${cy - 9} l1,-11 l5,9 Z`, fill: W_ }, m); // horns
    el("path", { d: `M${cx - 26},${cy - 1} l-9,3 l9,3 Z`, fill: W_ }, m);                                   // snout
    el("path", { d: `M${cx + 20},${cy + 6} q16,-2 14,-14 q-2,-8 -8,-4 q-4,4 2,6`, stroke: W_, "stroke-width": 3.5, fill: "none", "stroke-linecap": "round" }, m); // tail
    for (const lx of [-10, -2, 8, 16]) el("rect", { x: cx + lx, y: cy + 14, width: 3.5, height: 14, rx: 1.5, fill: W_ }, m); // legs
    el("circle", { cx: cx - 20, cy: cy - 3, r: 1.8, fill: B }, m);                                           // eye
    for (const [dx, dy] of [[-6, 6], [2, 4], [10, 8], [4, 12], [-2, 12], [12, 3]]) el("circle", { cx: cx + dx, cy: cy + dy, r: 1.7, fill: B }, m); // spots
    for (let i = 0; i < 3; i++) el("path", { d: `M${cx + 2 + i * 4},${cy - 8 - i * 6} l3,3`, stroke: B, "stroke-width": 1.2 }, m); // wing veins
  } else if (lane === "desfile") {
    // a giant skeleton marioneta on strings
    el("rect", { x: cx - 30, y: cy - 38, width: 60, height: 4, fill: W_ }, m);                                 // control bar
    for (const sx of [-26, 0, 26]) el("rect", { x: cx + sx - .8, y: cy - 36, width: 1.6, height: sx === 0 ? 12 : 26, fill: W_ }, m); // strings
    el("circle", { cx, cy: cy - 16, r: 9, fill: W_ }, m);                                                     // skull
    el("circle", { cx: cx - 3.5, cy: cy - 17, r: 2.4, fill: B }, m);
    el("circle", { cx: cx + 3.5, cy: cy - 17, r: 2.4, fill: B }, m);
    for (let i = -1; i <= 1; i++) el("rect", { x: cx + i * 3 - .6, y: cy - 11, width: 1.2, height: 3, fill: B }, m);
    el("rect", { x: cx - 1.5, y: cy - 7, width: 3, height: 22, fill: W_ }, m);                               // spine
    for (let i = 0; i < 3; i++) el("rect", { x: cx - 9 + i, y: cy - 3 + i * 5, width: 18 - 2 * i, height: 2.6, rx: 1.3, fill: W_ }, m); // ribs
    el("path", { d: `M${cx - 6},${cy - 5} L${cx - 26},${cy - 10} M${cx + 6},${cy - 5} L${cx + 26},${cy - 10}`, stroke: W_, "stroke-width": 3, "stroke-linecap": "round" }, m); // arms
    el("path", { d: `M${cx - 1},${cy + 15} L${cx - 10},${cy + 32} M${cx + 1},${cy + 15} L${cx + 12},${cy + 30}`, stroke: W_, "stroke-width": 3, "stroke-linecap": "round" }, m); // legs
  }
  const grp = el("g", { class: "banner" }, g);
  el("line", { x1: x - 14, y1: y - 2, x2: x + w + 14, y2: y - 2, stroke: cssv("--muted"), "stroke-width": 1 }, grp); // string
  el("rect", { x, y, width: w, height: h + 4, fill: cssv(BANNER[lane]), mask: `url(#${id})` }, grp);
  el("rect", { class: "bframe", x: x - 5, y: y - 6, width: w + 10, height: h + 16, rx: 6 }, grp);
  const cap = el("text", { class: "banner-cap", x: x + w / 2, y: y + h + 22, "text-anchor": "middle" }, grp);
  cap.textContent = T[lang].cap;
  return grp;
}

// ---------- node marks ----------
function mark(g, rank, color, cx, cy, r = 8) {
  el("circle", { class: "halo", cx, cy, r: r + 4 }, g);
  if (rank === "doc") el("circle", { class: "core", cx, cy, r, fill: color }, g);
  else if (rank === "stu") {
    el("circle", { class: "core", cx, cy, r: r - 1, fill: "none", stroke: color, "stroke-width": 2 }, g);
    el("path", { d: `M${cx},${cy - r + 1} A${r - 1},${r - 1} 0 0 0 ${cx},${cy + r - 1} Z`, fill: color }, g);
  } else if (rank === "pop") el("circle", { class: "core", cx, cy, r: r - 1, fill: "none", stroke: color, "stroke-width": 2 }, g);
  else if (rank === "disp") {
    el("circle", { class: "core", cx, cy, r: r - 1, fill: "none", stroke: color, "stroke-width": 1.6, opacity: .55 }, g);
    const k = r * .45;
    el("path", { class: "xmark", d: `M${cx - k},${cy - k} L${cx + k},${cy + k} M${cx + k},${cy - k} L${cx - k},${cy + k}`, stroke: color, opacity: .8 }, g);
  } else if (rank === "pend") el("circle", { class: "core", cx, cy, r: 5, fill: cssv("--gris") }, g);
  el("circle", { class: "ring", cx, cy, r: r + 4, fill: "none" }, g);
}

// ---------- build SVG ----------
const host = document.getElementById("diagram");
const tip = document.createElement("div"); tip.className = "tip"; tip.hidden = true; host.appendChild(tip);

function edgePath(a, b) {
  const mx = (a.x + b.x) / 2;
  if (Math.abs(a.y - b.y) < 2) return `M${a.x},${a.y} L${b.x},${b.y}`;
  return `M${a.x},${a.y} C${mx},${a.y} ${mx},${b.y} ${b.x},${b.y}`;
}

function draw() {
  W = Math.max(MIN_W, Math.floor(host.clientWidth)); X_END = W - 210;
  host.querySelector("svg")?.remove();
  const t = T[lang];
  const svg = el("svg", { width: W, height: H, viewBox: `0 0 ${W} ${H}`, role: "img", "aria-label": t.intro });
  host.insertBefore(svg, tip);

  // axis
  const ax = el("g", { class: "axis" }, svg);
  const ticks = [1500, 1600, 1850, 1900, 1950, 2010, 2026];
  for (const yv of ticks) {
    const x = xOf(yv);
    el("line", { x1: x, y1: TOP - 14, x2: x, y2: H - 30 }, ax).setAttribute("stroke-dasharray", "2 4");
    const tx = el("text", { x, y: TOP - 22, "text-anchor": "middle" }, ax); tx.textContent = yv;
  }
  // compressed stretch marker
  for (const [a, b] of [[1600, 1840], [1955, 2005]]) {
    const bx1 = xOf(a), bx2 = xOf(b);
    el("rect", { x: bx1, y: TOP - 14, width: bx2 - bx1, height: H - TOP - 16, fill: cssv("--line"), opacity: .25 }, ax);
    const br = el("text", { x: (bx1 + bx2) / 2, y: H - 14, "text-anchor": "middle" }, ax);
    br.textContent = lang === "es" ? "comprimido" : "compressed";
  }

  // lanes
  LANES.forEach((l, i) => {
    const y = laneY(l);
    if (i > 0) el("line", { class: "lane-rule", x1: 0, y1: y - LANE_H / 2, x2: W, y2: y - LANE_H / 2 }, svg);
    const lab = el("text", { class: "lane-label", x: 8, y: y + 6 }, svg); lab.textContent = t.lanes[l];
    const b = banner(svg, l, X_END + 60, y - LANE_H / 2 + 14);
    b.classList.add("node", "today");
    b.setAttribute("tabindex", 0); b.setAttribute("role", "button"); b.dataset.id = "today-" + l;
    b.setAttribute("aria-label", `${t.pendTitle}: ${t.lanes[l]}`);
    bindNode(b, "today-" + l);
  });

  // from each lane's last sourced point to its banner (today); grey where today is not sourced yet
  for (const l of LANES) {
    const a = pos(LAST[l]); const b = { x: X_END + 54, y: laneY(l) };
    el("path", { class: TODAY[l] ? "edge stu" : "edge pend", d: edgePath(a, b), stroke: TODAY[l] ? cssv(BANNER[l]) : null }, svg);
  }

  // edges
  for (const e of E) {
    const a = pos(e.f), b = pos(e.t);
    const color = cssv(INFL[byId[e.t].infl].c);
    const cls = e.r === "disp" ? "edge disp" : `edge ${e.r}`;
    const d = edgePath(a, b);
    el("path", { class: cls, d, stroke: color }, svg);
    if (e.note) {
      const hit = el("path", { class: "edgehit", d, tabindex: 0, role: "button", "aria-label": e.note.title[lang] }, svg);
      bindEdge(hit, e);
    }
  }

  // nodes
  for (const n of N) {
    const p = pos(n.id);
    const color = cssv(INFL[n.infl].c);
    const g = el("g", { class: "node" + (selected === n.id ? " sel" : ""), tabindex: 0, role: "button", "data-id": n.id, "aria-label": n.label[lang] }, svg);
    mark(g, n.rank, color, p.x, p.y);
    const lab = el("text", { class: "nlabel" + (n.myth ? " myth" : ""), x: p.x + 14, y: p.y + 1 }, g);
    lab.textContent = (n.short || n.label)[lang];  // short label on the timeline where a lane is crowded; the card shows the full title
    const yr = el("text", { class: "yr", x: p.x + 14, y: p.y + 14 }, g);
    yr.textContent = lang === "en" && n.yrEn ? n.yrEn : n.yr;
    bindNode(g, n.id);
  }
  fitLabels(svg);
}

// place each label right of its point if free; otherwise try the other candidate spots and keep the least crowded
function fitLabels(svg) {
  const boxes = [...svg.querySelectorAll("g.node .core, .lane-label, :scope > .yr")].map(c => c.getBBox());
  const hit = (a, b) => a.x < b.x + b.width + 4 && b.x < a.x + a.width + 4 && a.y < b.y + b.height + 5 && b.y < a.y + a.height + 5;
  const groups = [...svg.querySelectorAll("g.node[data-id]")].filter(g => byId[g.dataset.id])
    .sort((a, b) => pos(a.dataset.id).x - pos(b.dataset.id).x);
  for (const g of groups) {
    const p = pos(g.dataset.id), label = g.querySelector(".nlabel"), yr = g.querySelector(".yr");
    const box = () => { const a = label.getBBox(), b = yr.getBBox(); const x = Math.min(a.x, b.x), y = Math.min(a.y, b.y); return { x, y, width: Math.max(a.x + a.width, b.x + b.width) - x, height: Math.max(a.y + a.height, b.y + b.height) - y }; };
    // candidate spots in order of preference: [side, vertical shift of the label's baseline]
    const spots = [["right", 0], ["left", 0], ["right", -18], ["left", -18], ["right", 26], ["left", 26],
      ["right", -34], ["left", -34], ["right", 40], ["left", 40], ["right", -50], ["left", -50], ["right", 56], ["left", 56]];
    const place = ([s, dy]) => {
      for (const t of [label, yr]) { t.setAttribute("text-anchor", s === "right" ? "start" : "end"); t.setAttribute("x", s === "right" ? p.x + 14 : p.x - 14); }
      label.setAttribute("y", p.y + 1 + dy); yr.setAttribute("y", p.y + 14 + dy);
    };
    // cost of a spot: 0 when free; otherwise the number of things it touches, with running past the edges counted heavily
    const cost = b => (b.x + b.width > X_END - 6 ? 10 : 0) + (b.x < 4 ? 10 : 0) + boxes.filter(o => hit(b, o)).length;
    let best = spots[0], bestCost = Infinity;
    for (const sp of spots) { place(sp); const c = cost(box()); if (c < bestCost) { best = sp; bestCost = c; } if (c === 0) break; }
    place(best);
    boxes.push(box());
  }
}

// ---------- interaction ----------
function showTip(evt, html) {
  tip.innerHTML = html; tip.hidden = false;
  const r = host.getBoundingClientRect();
  const tgt = evt.currentTarget.getBoundingClientRect();
  let x = tgt.left - r.left + host.scrollLeft + tgt.width / 2 + 14;
  let y = tgt.top - r.top + tgt.height + 6;
  // flip above when the tip would run past the diagram's bottom: overflowing there adds a scrollbar,
  // the layout shifts, the pointer leaves the target and the tip flickers on and off
  const h = tip.offsetHeight;
  if (y + h > host.clientHeight - 4) y = Math.max(4, tgt.top - r.top - h - 6);
  const maxX = host.scrollLeft + host.clientWidth - 270;
  if (x > maxX) x = Math.max(host.scrollLeft + 4, tgt.left - r.left + host.scrollLeft - 270);
  tip.style.left = x + "px"; tip.style.top = y + "px";
}
const hideTip = () => { tip.hidden = true; };
const rankLine = r => `${RANK_MARK[r]} ${T[lang][r]}`;

function bindNode(g, id) {
  const n = byId[id];
  g.addEventListener("mouseenter", e => {
    if (n) showTip(e, `<b>${esc(n.label[lang])}</b>${esc(n.card[lang])}<div class="r">${rankLine(n.rank)}</div>`);
    else {
      const l = id.slice(6), td = TODAY[l];
      showTip(e, td ? `<b>${esc(td.title[lang])}</b>${esc(td.tip[lang])}<div class="r">${esc(T[lang].seeToday)}</div>`
                    : `<b>${esc(T[lang].pendTitle)}: ${esc(T[lang].lanes[l])}</b>${esc(PENDING[l][lang])}<div class="r">${rankLine("pend")}</div>`);
    }
  });
  g.addEventListener("mouseleave", hideTip);
  g.addEventListener("focus", e => g.dispatchEvent(new Event("mouseenter")));
  g.addEventListener("blur", hideTip);
  const act = () => { selected = id; hideTip(); renderCard(); markSel(); revealCard(); };
  g.addEventListener("click", act);
  g.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); act(); } });
}
function bindEdge(p, e) {
  p.addEventListener("mouseenter", ev => showTip(ev, `<b>${esc(e.note.title[lang])}</b>${esc(e.note[lang])}<div class="r">${rankLine(e.r)}</div>`));
  p.addEventListener("mouseleave", hideTip);
  const act = () => { selected = "edge:" + e.f + ">" + e.t; hideTip(); renderCard(); markSel(); revealCard(); };
  p.addEventListener("click", act);
  p.addEventListener("keydown", ev => { if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); act(); } });
}
function markSel() { host.querySelectorAll("g.node").forEach(g => g.classList.toggle("sel", g.dataset.id === selected)); }

const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);

function srcHtml(key, where) {
  const s = S[key]; if (!s) return "";
  return `<div class="src">${esc(T[lang].source)}: <a href="${s.url}" target="_blank" rel="noopener">${esc(s.label)}</a>${where ? ", " + esc(where[lang]) : ""}</div>`;
}
function quoteHtml(q, qen) {
  if (!q) return "";
  const tr = lang === "en" && qen && qen !== q ? `<div class="tr"><span class="lab">${esc(T.en.translation)}</span>${esc(qen)}</div>` : "";
  return `<blockquote lang="es">${esc(q)}</blockquote>${tr}`;
}
function claimHtml(c) {
  return `<li><span class="mark" style="color:var(--muted)" title="${esc(T[lang][c.rank])}">${RANK_MARK[c.rank]}</span><div class="body"><p>${esc(c.t[lang])}</p>${quoteHtml(c.q, c.qen)}${c.n ? `<p class="note">${esc(c.n[lang])}</p>` : ""}${srcHtml(c.s, c.where)}</div></li>`;
}
function renderCard() {
  const card = document.getElementById("card"); const t = T[lang];
  if (selected.startsWith("edge:")) {
    const [f, to] = selected.slice(5).split(">"); const e = E.find(x => x.f === f && x.t === to); const nt = e.note;
    card.innerHTML = `<div class="kicker"><span>${esc(byId[f].yr)} → ${esc(byId[to].yr)}</span><span class="chip" style="color:var(--muted)">${rankLine(e.r)}</span></div><h2>${esc(nt.title[lang])}</h2><p>${esc(nt[lang])}</p>${nt.q ? `<ul class="claims"><li><span class="mark" style="color:var(--muted)">${RANK_MARK[e.r]}</span><div class="body">${quoteHtml(nt.q, nt.qen)}${srcHtml(nt.s)}</div></li></ul>` : ""}`;
    return;
  }
  if (selected.startsWith("today-")) {
    const l = selected.slice(6), td = TODAY[l];
    if (!td) {
      card.innerHTML = `<div class="kicker"><span>2026 · ${esc(t.lanes[l])}</span><span class="chip" style="color:var(--gris)">${rankLine("pend")}</span></div><h2>${esc(t.pendTitle)}: ${esc(t.lanes[l])}</h2><p>${esc(PENDING[l][lang])}</p>`;
      return;
    }
    const steps = td.steps.map(s => { const n = byId[s.id]; return `<li><button type="button" data-go="${s.id}"><span style="color:var(${INFL[n.infl].c})">${RANK_MARK[n.rank]}</span><span class="y">${esc(lang === "en" && n.yrEn ? n.yrEn : n.yr)}</span><span>${esc(s[lang])}</span></button></li>`; }).join("");
    card.innerHTML = `<div class="kicker"><span>2026 · ${esc(t.lanes[l])}</span><span class="chip" style="color:var(${BANNER[l]})">${esc(t.pendTitle)}</span></div>
      <h2>${esc(td.title[lang])}</h2><p>${esc(td.now[lang])}</p>
      <h3>${esc(t.lineage)}</h3><ol class="steps">${steps}</ol>
      <div class="whyd"><b>${esc(td.clashTitle ? td.clashTitle[lang] : t.clash)}.</b> ${esc(td.clash[lang])}</div>
      <ul class="claims">${td.claims.map(claimHtml).join("")}</ul>
      <p class="legendnote">${esc(t.meaningNote)}</p>`;
    card.querySelectorAll("[data-go]").forEach(b => b.addEventListener("click", () => {
      selected = b.dataset.go; renderCard(); markSel();
      host.querySelector(`g.node[data-id="${selected}"]`)?.focus({ preventScroll: true });
    }));
    return;
  }
  const n = byId[selected]; const inf = INFL[n.infl];
  card.innerHTML = `<div class="kicker"><span>${esc(lang === "en" && n.yrEn ? n.yrEn : n.yr)} · ${esc(t.lanes[n.lane])}</span><span class="chip" style="color:var(${inf.c})">${esc(inf[lang])}</span><span class="chip" style="color:var(--muted)">${rankLine(n.rank)}</span></div>
    <h2>${esc(n.label[lang])}</h2><p>${esc(n.card[lang])}</p>
    ${n.why ? `<div class="whyd"><b>${esc(t.why)}.</b> ${esc(n.why[lang])}</div>` : ""}
    ${n.claims.length ? `<ul class="claims">${n.claims.map(claimHtml).join("")}</ul>` : ""}`;
}

// ---------- legend ----------
function lineSample(r) {
  const svg = `<svg width="34" height="12" aria-hidden="true"><line x1="2" y1="6" x2="32" y2="6" stroke="var(${r === "pend" ? "--gris" : "--ink"})" stroke-width="2.2" stroke-linecap="round" ${r === "stu" ? 'stroke-dasharray="7 5"' : r === "pop" || r === "disp" ? 'stroke-dasharray="1.5 5"' : r === "pend" ? 'stroke-dasharray="2 6"' : ""} ${r === "disp" ? 'opacity=".45"' : ""}/></svg>`;
  return svg;
}
function renderLegend() {
  const t = T[lang];
  const ranks = ["doc", "stu", "pop", "disp", "pend"].map(r => `<span class="item" title="${esc(t[r + "L"])}">${lineSample(r)}${RANK_MARK[r]} ${esc(t[r])}</span>`).join("");
  const infl = Object.values(INFL).map(i => `<span class="item"><span class="swatch" style="background:var(${i.c})"></span>${esc(i[lang])}</span>`).join("");
  document.getElementById("legend").innerHTML = `<div class="group"><span class="gl">${esc(t.ranks)}</span>${ranks}</div><div class="group"><span class="gl">${esc(t.infl)}</span>${infl}</div>`;
}

// ---------- bibliography ----------
function renderBib() {
  const t = T[lang];
  const html = LANES.map(l => {
    const keys = [...new Set(N.filter(n => n.lane === l).flatMap(n => n.claims.map(c => c.s)).concat(E.filter(e => e.note && e.note.s && byId[e.t].lane === l).map(e => e.note.s)).concat(TODAY[l] ? TODAY[l].claims.map(c => c.s) : []))];
    return `<div><h4>${esc(t.lanes[l])}</h4><ul>${keys.map(k => `<li><a href="${S[k].url}" target="_blank" rel="noopener">${esc(S[k].label)}</a></li>`).join("")}</ul></div>`;
  }).join("");
  document.getElementById("bib").innerHTML = html;
}

// ---------- i18n ----------
function applyLang() {
  document.documentElement.lang = lang;
  document.querySelectorAll("[data-i18n]").forEach(e => e.textContent = T[lang][e.dataset.i18n]);
  document.querySelectorAll("[data-i18n-html]").forEach(e => e.innerHTML = T[lang][e.dataset.i18nHtml]);
  document.querySelectorAll(".lang button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.lang === lang)));
  renderLegend(); draw(); renderCard(); renderBib();
}
document.querySelectorAll(".lang button").forEach(b => b.addEventListener("click", () => {
  lang = b.dataset.lang; try { localStorage.setItem("ddm-lang", lang); } catch (e) {} applyLang();
}));
// bring the details card into view when it sits below the fold
function revealCard() {
  const c = document.getElementById("card"), r = c.getBoundingClientRect();
  if (r.top > innerHeight - 80 || r.bottom < 0) {
    const calm = matchMedia("(prefers-reduced-motion: reduce)").matches;
    c.scrollIntoView({ behavior: calm ? "auto" : "smooth", block: "nearest" });
  }
}
// redraw when the available width changes
let lastW = 0, raf = 0;
new ResizeObserver(() => {
  const w = Math.floor(host.clientWidth);
  if (w === lastW) return; lastW = w;
  cancelAnimationFrame(raf); raf = requestAnimationFrame(() => { hideTip(); draw(); });
}).observe(host);
applyLang();
})();
</script>
